<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Uang ke Bandung 🌴</title>
    <!-- Font Minimalis Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <!-- Library Chart.js untuk Admin -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- HALAMAN UTAMA -->
    <div class="main-wrapper" id="main-page">
        
        <!-- TOP BAR: Logo di Kiri, Total Tabungan Tepat di Tengah -->
        <header class="top-bar">
            <div class="logo-box animated-logo">
                <!-- Jika ada file logo, ganti teks di bawah dengan: <img src="logo.png" alt="Logo"> -->
                <img src="logo.png" alt="Logo">
            </div>
            
            <div class="balance-display-card">
                <span class="balance-label">Total Tabungan</span>
                <h1 id="total-balance" class="balance-amount">Rp 0</h1>
            </div>
        </header>

        <!-- KONTEN UTAMA LAYOUT SKETSA -->
        <main class="grid-container">
            <!-- Bagian Kiri: Judul Utama (Digeser sedikit ke kanan & lebih lega) -->
            <div class="title-section">
                <h1 class="main-title">
                    <span class="font-kugile">Data</span><br>
                    <span class="font-transity">uang<br>ke Bandung</span>
                </h1>
            </div>

            <!-- Bagian Tengah: Tombol Masukan Nominal -->
            <div class="center-action-section">
                <button id="btn-open-input" class="bubble-input-btn">
                    <span>Masukan<br>nominal</span>
                </button>
            </div>

            <!-- Bagian Bawah Kanan: Container Riwayat Setoran (Diperbesar) -->
            <div class="history-section-card">
                <h3 class="card-title">Riwayat Setoran</h3>
                <div id="history-list" class="history-scroll-list">
                    <p class="empty-state">Memuat data setoran...</p>
                </div>
            </div>
        </main>

        <!-- FOOTER & CREDIT -->
        <footer class="footer-bar">
            <!-- Secret Trigger Admin (Terlihat Tipis Hanya Bagi yang Jeli) -->
            <button id="btn-secret-admin" class="secret-admin-btn" title="Dashboard Admin"></button>
            
            <!-- Credit Teks -->
            <p class="credit-text">Credit by <strong>JawirStory</strong></p>
        </footer>
    </div>

    <!-- POP-UP MODAL INPUT NOMINAL -->
    <div id="input-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Setor Tabungan</h3>
            <form id="savings-form">
                <div class="input-group">
                    <label for="name-input">Nama Penyetor</label>
                    <input type="text" id="name-input" placeholder="Contoh: Marcel" required>
                </div>
                <div class="input-group">
                    <label for="amount-input">Jumlah Nominal (Rp)</label>
                    <input type="number" id="amount-input" placeholder="Contoh: 50000" min="1" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btn-close-input" class="btn-secondary">Batal</button>
                    <button type="submit" class="btn-primary">Catat Setoran</button>
                </div>
            </form>
        </div>
    </div>

    <!-- POP-UP MODAL LOGIN ADMIN -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Login Admin</h3>
            <div class="input-group">
                <input type="text" id="admin-user" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="admin-pass" placeholder="Password">
            </div>
            <p id="login-error" class="error-msg hidden">Username atau Password salah!</p>
            <div class="modal-actions">
                <button id="btn-cancel-login" class="btn-secondary">Batal</button>
                <button id="btn-login" class="btn-primary">Masuk</button>
            </div>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD ADMIN (TERSEMBUNYI) -->
    <div class="main-wrapper hidden" id="admin-page">
        <header class="top-bar-admin">
            <div>
                <h2>Dashboard Admin</h2>
                <small style="color: #666;">Statistik & Log Penghapusan</small>
            </div>
            <button id="btn-close-admin" class="btn-secondary" style="width: auto; padding: 10px 20px;">Kembali</button>
        </header>

        <main class="admin-grid">
            <div class="admin-card">
                <h3>Grafik Pemasukan Harian</h3>
                <canvas id="myChart"></canvas>
            </div>
            <div class="admin-card">
                <h3 style="color: #ff4d4f;">Log Pembatalan / Uang Dihapus</h3>
                <div id="trash-list" class="history-scroll-list"></div>
            </div>
        </main>
    </div>

    <script type="module" src="app.js?v=5"></script>
</body>
</html>
