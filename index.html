<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Villa 🌴</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <!-- Mengambil alat pembuat grafik otomatis (Chart.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    
    <!-- HALAMAN UTAMA -->
    <div class="app-container" id="main-page">
        <header class="dana-header">
            <p>Total Tabungan Villa</p>
            <h1 id="total-balance">Rp 0</h1>
        </header>

        <main class="content">
            <section class="card input-section">
                <h3>Tambah Tabungan</h3>
                <form id="savings-form">
                    <div class="input-group">
                        <label>Nama Penyetor</label>
                        <input type="text" id="name-input" placeholder="Contoh: Marcel" required>
                    </div>
                    <div class="input-group">
                        <label>Jumlah Setoran (Rp)</label>
                        <input type="number" id="amount-input" placeholder="Contoh: 50000" min="1" required>
                    </div>
                    <button type="submit" class="btn-primary">Catat Setoran</button>
                </form>
            </section>

            <section class="card history-section">
                <h3>Riwayat Setoran</h3>
                <div id="history-list" class="history-list"></div>
            </section>

            <!-- Tombol Rahasia Admin -->
            <div style="text-align: center; margin-top: 15px;">
                <button id="btn-show-login" class="btn-text">Admin Dashboard</button>
            </div>
        </main>
    </div>

    <!-- HALAMAN ADMIN (TERSEMBUNYI) -->
    <div class="app-container hidden" id="admin-page">
        <header class="dana-header" style="background: linear-gradient(135deg, #333 0%, #111 100%); padding-bottom: 60px;">
            <p>Dashboard Admin</p>
            <h1 style="font-size: 24px;">Statistik Bulanan</h1>
        </header>

        <main class="content">
            <!-- Tempat Grafik Chart.js -->
            <section class="card">
                <h3>Grafik Pemasukan Harian</h3>
                <canvas id="myChart"></canvas>
            </section>

            <!-- Log Uang Dihapus -->
            <section class="card history-section">
                <h3 style="color: #ff4d4f;">Riwayat Uang Dihapus (Batal)</h3>
                <div id="trash-list" class="history-list"></div>
            </section>

            <button id="btn-close-admin" class="btn-primary" style="background: #333;">Kembali ke Halaman Utama</button>
        </main>
    </div>

    <!-- POP-UP LOGIN ADMIN -->
    <div id="login-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Login Admin</h3>
            <div class="input-group">
                <input type="text" id="admin-user" placeholder="Username">
            </div>
            <div class="input-group">
                <input type="password" id="admin-pass" placeholder="Password">
            </div>
            <p id="login-error" style="color: red; font-size: 12px; display: none;">Username atau Password salah!</p>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-cancel-login" class="btn-secondary">Batal</button>
                <button id="btn-login" class="btn-primary">Masuk</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js?v=3"></script>
</body>
</html>
