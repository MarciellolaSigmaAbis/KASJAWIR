<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabungan Villa 🌴</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="dana-header">
            <p>Total Tabungan Villa</p>
            <h1 id="total-balance">Rp 0</h1>
        </header>

        <main class="content">
            <section class="card input-section">
                <h3>Tambah Tabungan</h3>
                <form id="savings-form">
                    <div class="input-group">
                        <label for="name-input">Nama Penyetor</label>
                        <input type="text" id="name-input" placeholder="Contoh: Marcel" required>
                    </div>
                    <div class="input-group">
                        <label for="amount-input">Jumlah Setoran (Rp)</label>
                        <input type="number" id="amount-input" placeholder="Contoh: 50000" min="1" required>
                    </div>
                    <button type="submit" class="btn-primary">Catat Setoran</button>
                </form>
            </section>

            <section class="card history-section">
                <h3>Riwayat Setoran</h3>
                <div id="history-list" class="history-list">
                    <p class="empty-state">Memuat data...</p>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
